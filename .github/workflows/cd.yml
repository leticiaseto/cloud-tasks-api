name: CD - deploy EC2
on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # Só depois de CI verde disparado por push na main.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    # Runner instalado na própria EC2: conexão só de saída, sem SSH.
    runs-on: [self-hosted, Linux, X64]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy da imagem do commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"
          bash scripts/deploy.sh "$IMAGE"
      - name: Verificar /health
        run: curl --fail --show-error --retry 10 --retry-delay 3 http://127.0.0.1/health
